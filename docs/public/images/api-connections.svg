<g fill="white" stroke="#94a3b8"><rect x="25" y="125" width="180" height="90" rx="10"/><rect x="295" y="125" width="200" height="90" rx="10"/><rect x="585" y="25" width="210" height="80" rx="10"/><rect x="585" y="130" width="210" height="80" rx="10"/><rect x="585" y="235" width="210" height="80" rx="10"/></g>
