[project]
name = "corpora-api"
version = "0.6.2"
description = "HTTP and MCP interfaces to corpora-core checks and converters"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "corpora-corpus-validate",
  "corpora-linking>=0.1.0,<0.2",
  "corpora-schema-types",
  "fastapi>=0.115,<1",
  "fastmcp>=4,<5",
  "httpx>=0.28,<1",
  "huggingface-hub>=1.0,<2",
  "lxml>=5,<7",
  "psycopg[binary]>=3.2,<4",
  "pyjwt[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
linking-pdf = [
    "pymupdf>=1.24,<2",
]

[dependency-groups]
dev = ["httpx2>=2.16,<3", "pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/corpora_api"]

[tool.pytest.ini_options]
testpaths = ["tests/api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv.sources]
corpora-corpus-validate = { git = "https://github.com/exegia/corpora-core.git", subdirectory = "packages/corpus-validate", rev = "e1f81485a5964150deadd3821fff077c9d9b3d8e" }
corpora-schema-types = { git = "https://github.com/exegia/corpora-core.git", subdirectory = "generated/python", rev = "e1f81485a5964150deadd3821fff077c9d9b3d8e" }
