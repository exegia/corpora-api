[project]
name = "corpora-api"
version = "0.5.0"
description = "HTTP and MCP interfaces to corpora-core checks and converters"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "corpora-corpus-validate",
  "corpora-schema-types",
  "fastapi>=0.115,<1",
  "fastmcp>=4,<5",
  "httpx>=0.28,<1",
  "huggingface-hub>=1.0,<2",
  "pyjwt[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["httpx2>=2.16,<3", "pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/corpora_api"]

[tool.pytest.ini_options]
testpaths = ["tests/api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv.sources]
corpora-corpus-validate = { git = "https://github.com/exegia/corpora-core.git", subdirectory = "packages/corpus-validate", rev = "45fa716c1b7f8d1ebd8ec49f2844bb72e13d5eb8" }
corpora-schema-types = { git = "https://github.com/exegia/corpora-core.git", subdirectory = "generated/python", rev = "45fa716c1b7f8d1ebd8ec49f2844bb72e13d5eb8" }
