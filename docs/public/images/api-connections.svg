<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-labelledby="title desc">
<title id="title">Corpora API connections</title><desc id="desc">Your app sends HTTPS requests to the API. The API connects to Supabase for identity and metadata, Hugging Face for private archive bytes, and Corpora Core for validation and reading.</desc>
